# Optional profile: run the backend without PostgreSQL.
# Start with:  java -jar target/edge-sdn-backend-1.0.0.jar --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/edgesdn;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
